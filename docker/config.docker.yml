# Engram config for the Docker stack. Paths live under /data; SearXNG is the
# internal compose service. Override by mounting your own at /data/config.yml.
paths:
  root: /data
  vault: /data/vault
  playbooks_scratch: /data/playbooks/scratch
  playbooks_curated: /data/playbooks/curated
  playbooks_runs: /data/playbooks/runs
  db: /data/db.sqlite

rag:
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  embed_dim: 384
  chunk_size_tokens: 512
  chunk_overlap_tokens: 64
  top_k: 12
  rrf_k: 60
  near_dup_threshold: 0.92

research:
  searxng_url: "http://searxng:8080"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  web_default_k: 8
  web_max_candidates: 20
  arxiv_enabled: true
  arxiv_default_k: 5

# Confidence ranking weights — soft prior, not ground truth. Keep the spread
# narrow so a directly-relevant blog can outrank a tangentially-relevant paper.
confidence:
  source_tier_weights:
    peer-reviewed: 0.85
    vendor-doc:    0.80
    manual:        0.70
    agent-derived: 0.60
    blog:          0.55
    forum:         0.30
  recency_half_life_days: 365   # exponential decay; topic-specific overrides via ttl_days on content

# Vault projector.
projector:
  # How often to scan for pending log events to render. Reactor pushes events;
  # this is a backstop polling cadence (seconds).
  poll_interval: 5
  # Subdirs by content kind.
  kind_dirs:
    kb:                050-kb
    episode:           010-episodes
    entity:            020-entities
    research:          030-research
    playbook-summary:  030-research/playbook-runs

# Vault watcher (Obsidian → log sync-back).
watcher:
  # Debounce window for editor save bursts (ms).
  debounce_ms: 800
  # Ignore patterns relative to vault root.
  ignore:
    - .obsidian/**
    - .trash/**
    - "**/.DS_Store"

# Reactor.
reactor:
  # Workers for embed-on-ingest. Each holds the embedding model in memory.
  embed_workers: 1
  # Mark content stale on retrieval if older than this fraction of ttl_days.
  retrieval_staleness_threshold: 0.8

# Playbooks.
playbooks:
  default_runtime: jupyter   # 'jupyter' | 'marimo'
  jupyter:
    kernel: python3
  marimo:
    headless: true
