name: CI

on:
  pull_request:
    # Skip CI for doc-only changes (nothing here affects lint or the unit suite).
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]

# setup-uv@v6 still bundles a Node 20 entrypoint; opt JS actions into Node 24
# now (GitHub force-migrates on 2026-06-16 regardless). Clears the deprecation.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # No uv.lock is committed; key the cache on pyproject.toml so it
          # invalidates when deps change instead of "never invalidating".
          cache-dependency-glob: '**/pyproject.toml'

      - name: Pin Python 3.11
        run: uv python install 3.11

      - name: Ruff (lint)
        run: uv run --python 3.11 --extra dev ruff check .

      # tests/sources is the hermetic unit suite: sqlite + httpx.MockTransport,
      # no network, no embedding model, no LLM — safe on hosted runners.
      # tests/integration (end-to-end) is intentionally excluded until its
      # fixtures/mocks are wired up (see CI "Option B").
      #
      # NOTE: `uv run` installs the project, which pulls torch via
      # sentence-transformers — that's the bulk of the install and is cached by
      # setup-uv across runs. To slim this, move sentence-transformers/torch into
      # an optional `[rag]` extra so this job installs a lighter core.
      - name: Unit tests
        run: uv run --python 3.11 --extra dev pytest tests/sources -q
