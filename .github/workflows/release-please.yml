name: release-please

# On every push to main, release-please maintains a standing "release PR" that
# accumulates the changelog + version bump computed from the Conventional
# Commits since the last release. Merge that PR to cut a release: release-please
# then tags the repo and creates the GitHub release. It never pushes to main
# directly (PR model), so protected-branch rules are respected.
on:
  push:
    branches: [main]

permissions:
  contents: write        # create tags + GitHub releases
  pull-requests: write   # open/update the release PR

# Don't let two release runs race; never cancel one mid-release.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Authored with a PAT so the release PR's required checks run.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Re-lock uv.lock on the release PR so 'uv run --locked' passes.
      - name: Check out the release branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v6
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install uv
        if: ${{ steps.release.outputs.pr }}
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Pin Python 3.11
        if: ${{ steps.release.outputs.pr }}
        run: uv python install 3.11

      - name: Sync uv.lock to the release version
        if: ${{ steps.release.outputs.pr }}
        run: |
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync with the bumped version; nothing to push."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'chore: sync uv.lock to release version'
          git push
