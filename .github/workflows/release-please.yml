name: release-please

# On every push to main, release-please maintains a standing "release PR" that
# accumulates the changelog + version bump computed from the Conventional
# Commits since the last release. Merge that PR to cut a release: release-please
# then tags the repo and creates the GitHub release. It never pushes to main
# directly (PR model), so protected-branch rules are respected.
on:
  push:
    branches: [main]

permissions:
  contents: write        # create tags + GitHub releases
  pull-requests: write   # open/update the release PR

# Don't let two release runs race; never cancel one mid-release.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps pyproject.toml but not uv.lock, so the bumped
      # version leaves the lockfile stale and `uv run --locked` (CI) fails on the
      # release PR. When a release PR is open, check out its branch, re-lock, and
      # commit the synced lockfile back to it.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v7
        if: ${{ steps.release.outputs.pr }}
      - name: Sync uv.lock to the release version
        if: ${{ steps.release.outputs.pr }}
        run: |
          uv lock
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: sync uv.lock to release version"
            git push
          fi
