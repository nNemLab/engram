name: release-please

# On every push to main, release-please maintains a standing "release PR" that
# accumulates the changelog + version bump computed from the Conventional
# Commits since the last release. Merge that PR to cut a release: release-please
# then tags the repo and creates the GitHub release. It never pushes to main
# directly (PR model), so protected-branch rules are respected.
on:
  push:
    branches: [main]

permissions:
  contents: write        # create tags + GitHub releases
  pull-requests: write   # open/update the release PR

# Don't let two release runs race; never cancel one mid-release.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # release-please owns uv.lock's version line directly (see the uv.lock
      # extra-files entry in release-please-config.json), so the lockfile stays
      # in sync with the pyproject bump without a separate bot commit. That
      # second commit used to be pushed with GITHUB_TOKEN, which suppresses CI
      # (GitHub's recursion guard) and left the release PR's required check
      # stalled forever. Only the editable root package's `version` changes at
      # release time — dependency changes already land their own uv.lock delta
      # in the feature PR — so a single-line bump matches what `uv lock` emits.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
