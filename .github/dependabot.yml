version: 2
updates:
  # Keep GitHub Actions current — would have flagged the checkout@v4 / Node-20
  # deprecation we hand-fixed instead of letting it rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Python dependencies (reads pyproject.toml).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
